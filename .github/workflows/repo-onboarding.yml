# ============================================================================================
# repo-onboarding.yml — self-service MuleSoft API repo onboarding (GitHub Actions)
# --------------------------------------------------------------------------------------------
# GitHub counterpart of repo_onboarding/repo-onboarding-pipeline.yml (the Azure "initial-repo-setup"
# pipeline). Manual trigger only. Runs repo_onboarding/create-repo-github.sh, which reuses the customized
# create-repo.sh for every platform-neutral step and talks to GitHub for the rest.
#
# The `bg` options mirror the Azure dropdown; the foundry re-seeds them from the customized Azure
# pipeline at setup (one list, both planes). The BG's Anypoint org id is read from the Actions variables
# (ANYPOINT_BG_ID, or <BGKEY>_ANYPOINT_BG_ID on a multi-BG foundation) — the Azure variable group.
#
# Secrets: ONBOARDING_TOKEN — a token for the script's GitHub work only (repo create, contents,
#   workflows, administration for rulesets; classic PAT scopes repo + workflow + admin:org). It is NOT a
#   Maven credential. Maven settings.xml is GENERATED INLINE at runtime by the setup-maven-settings
#   composite action from the org-level secrets (MULESOFT_EE_*, ANYPOINT_EXCHANGE_CLIENT_SECRET).
# ============================================================================================
name: repo-onboarding

on:
  workflow_dispatch:
    inputs:
      bg:
        description: Business Group
        type: choice
        default: americas
        options:
          - SalesForce
          - americas
          - asia
          - europe
      apiName:
        description: Core API Name (e.g., dealer-mgmt, customer-sync)
        type: string
        default: sample-api
      apiLayer:
        description: API Layer Type
        type: choice
        default: System
        options:
          - System
          - Process
          - Experience
          - Omni
          - Api Proxy
      deploymentTarget:
        description: Deployment Target (Mule runtime)
        type: choice
        default: RTF
        options:
          - RTF
          - CH2
          - ONPREM
      hasRaml:
        description: API has a RAML spec published to Exchange?
        type: boolean
        default: true
      ramlArtifactId:
        description: RAML artifact name in Exchange (AUTO = use API name)
        type: string
        default: AUTO
      ramlVersion:
        description: RAML artifact version in Exchange
        type: string
        default: 1.0.0
      additionalDeploymentBGs:
        description: Additional BGs to deploy to (comma-separated, or 'none')
        type: string
        default: none

permissions:
  contents: read

concurrency:
  group: repo-onboarding-${{ inputs.apiName }}
  cancel-in-progress: false

jobs:
  provisioning:
    name: Provision MuleSoft API Resources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Java 17, Maven 3.9.4, Maven cache, AND generate settings.xml inline from org secrets.
      # The composite action lives in THIS repo (mule-cicd-workflows), so the relative path is used.
      - name: Setup Java, Maven, and settings.xml (inline from org secrets)
        uses: ./.github/actions/setup-maven-settings
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mulesoft-ee-username: ${{ secrets.MULESOFT_EE_USERNAME }}
          mulesoft-ee-password: ${{ secrets.MULESOFT_EE_PASSWORD }}
          anypoint-exchange-client-secret: ${{ secrets.ANYPOINT_EXCHANGE_CLIENT_SECRET }}

      - name: Alias MAVEN_SETTINGS_PATH for the onboarding script
        run: echo "MAVEN_SETTINGS_PATH=$MDF_SETTINGS_XML" >> "$GITHUB_ENV"

      - name: Execute onboarding script
        env:
          BG: ${{ inputs.bg }}
          API_NAME: ${{ inputs.apiName }}
          API_LAYER: ${{ inputs.apiLayer }}
          DEPLOYMENT_TARGET: ${{ inputs.deploymentTarget }}
          HAS_RAML: ${{ inputs.hasRaml }}
          RAML_ARTIFACT_ID: ${{ inputs.ramlArtifactId }}
          RAML_VERSION: ${{ inputs.ramlVersion }}
          ADDITIONAL_DEPLOYMENT_BGS: ${{ inputs.additionalDeploymentBGs }}
          GITHUB_ORG: ${{ github.repository_owner }}
          VARS_JSON: ${{ toJSON(vars) }}
          GH_TOKEN: ${{ secrets.ONBOARDING_TOKEN }}
          # Client repo names (the foundry fills these at setup when the base repos were renamed).
          ENV_SETTINGS_REPO_NAME: mule-app-env-settings
          APP_TEMPLATE_REPO: template-sample-api
          APP_TEMPLATE_ONPREM_REPO: template-onprem-sample-api
        run: bash repo_onboarding/create-repo-github.sh
