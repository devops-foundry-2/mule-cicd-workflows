name: setup-maven-settings
description: >-
  Sets up JDK 17 + Maven 3.9.4 + the Maven cache, then GENERATES settings.xml inline from
  individual org-level secrets (never a pre-baked base64 blob). This keeps each secret value
  separate in GitHub secret storage — only the raw credentials live in GitHub, never a filled
  file. Writes the generated file to the runner temp dir and exports MDF_SETTINGS_XML.

  Inputs are component secrets passed by the caller via env. None appear in logs.

inputs:
  github-token:
    description: GITHUB_TOKEN for GitHub Packages auth (read/write).
    required: true
  github-username:
    description: Username for the GitHub Packages <server>. Defaults to the actor.
    required: false
    default: ''
  mulesoft-ee-username:
    description: MuleSoft EE repository username (Anypoint Platform username).
    required: false
    default: ''
  mulesoft-ee-password:
    description: MuleSoft EE repository password (Anypoint Platform password).
    required: false
    default: ''
  anypoint-exchange-client-id:
    description: >-
      Anypoint Exchange v3 server username. Use '~~~' (the literal tilde × 3 convention) when
      the password holds a Connected App client_secret; otherwise the Connected App client_id.
    required: false
    default: '~~~'
  anypoint-exchange-client-secret:
    description: Anypoint Exchange v3 Connected App client_secret.
    required: false
    default: ''
  cache-key:
    description: actions/cache key for the Maven repository.
    required: false
    default: ''
  cache-restore-keys:
    description: actions/cache restore-keys.
    required: false
    default: ''
  java-version:
    description: JDK major version (Mule 4.x requires 17).
    required: false
    default: '17'
  maven-version:
    description: >-
      Maven version. mule-maven-plugin 4.x needs <= 3.9.4 — newer resolvers dropped
      DefaultMirrorSelector.add() (NoSuchMethodError at process-sources).
    required: false
    default: '3.9.4'

runs:
  using: composite
  steps:
    - id: jdk
      shell: bash
      env:
        MDF_JAVA_VERSION: ${{ inputs.java-version }}
      run: |
        set -euo pipefail
        var="JAVA_HOME_${MDF_JAVA_VERSION}_X64"
        home="${!var:-}"
        if [[ -n "$home" && -x "$home/bin/java" ]]; then
          echo "JAVA_HOME=$home" >> "$GITHUB_ENV"
          echo "$home/bin" >> "$GITHUB_PATH"
          echo "preinstalled=true" >> "$GITHUB_OUTPUT"
        else
          echo "preinstalled=false" >> "$GITHUB_OUTPUT"
        fi

    - if: steps.jdk.outputs.preinstalled != 'true'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - id: maven
      shell: bash
      env:
        MDF_MVN_VERSION: ${{ inputs.maven-version }}
      run: |
        set -euo pipefail
        [[ "$MDF_MVN_VERSION" =~ ^3\.[0-9]+\.[0-9]+$ ]] || { echo "::error::maven-version '$MDF_MVN_VERSION' is not a Maven 3.x.y version."; exit 1; }
        current="$(mvn --version 2>/dev/null | sed -nE 's/^Apache Maven ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n1)" || current=""
        if [[ "$current" == "$MDF_MVN_VERSION" ]]; then
          echo "Maven $MDF_MVN_VERSION already installed — skipping download."
          exit 0
        fi
        dir="$RUNNER_TEMP/apache-maven-$MDF_MVN_VERSION"
        if [[ ! -x "$dir/bin/mvn" ]]; then
          echo "Installing Maven $MDF_MVN_VERSION (runner has ${current:-none})..."
          url="https://archive.apache.org/dist/maven/maven-3/$MDF_MVN_VERSION/binaries/apache-maven-$MDF_MVN_VERSION-bin.tar.gz"
          tgz="$RUNNER_TEMP/apache-maven-$MDF_MVN_VERSION-bin.tar.gz"
          curl -fsSL --retry 3 -o "$tgz" "$url"
          want="$(curl -fsSL --retry 3 "$url.sha512" | awk '{print $1}')"
          if command -v sha512sum >/dev/null 2>&1; then got="$(sha512sum "$tgz" | awk '{print $1}')"; else got="$(shasum -a 512 "$tgz" | awk '{print $1}')"; fi
          [[ -n "$want" && "$got" == "$want" ]] || { echo "::error::Maven $MDF_MVN_VERSION download failed its SHA-512 check."; exit 1; }
          tar -xzf "$tgz" -C "$RUNNER_TEMP"
          rm -f "$tgz"
        fi
        echo "$dir/bin" >> "$GITHUB_PATH"
        echo "Installed Maven $MDF_MVN_VERSION at $dir/bin/mvn"

    - if: inputs.cache-key != ''
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/pw/.m2/repository
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.cache-restore-keys }}

    - name: Generate settings.xml inline from org secrets
      shell: bash
      env:
        MDF_GITHUB_USERNAME: ${{ inputs.github-username != '' && inputs.github-username || github.actor }}
        MDF_GITHUB_TOKEN: ${{ inputs.github-token }}
        MDF_EE_USERNAME: ${{ inputs.mulesoft-ee-username }}
        MDF_EE_PASSWORD: ${{ inputs.mulesoft-ee-password }}
        MDF_EXCHANGE_ID: ${{ inputs.anypoint-exchange-client-id }}
        MDF_EXCHANGE_SECRET: ${{ inputs.anypoint-exchange-client-secret }}
      run: |
        set -euo pipefail
        # Fail-fast on missing GITHUB_TOKEN — the only universally required credential
        if [[ -z "${MDF_GITHUB_TOKEN:-}" ]]; then
          echo "::error::GITHUB_TOKEN was not supplied to setup-maven-settings. Caller must pass secrets.GITHUB_TOKEN."
          exit 1
        fi

        dir="$RUNNER_TEMP/mdf-secure-files"
        mkdir -p "$dir"
        chmod 700 "$dir"
        file="$dir/settings.xml"
        umask 077

        # Compose settings.xml. Empty optional sections are OMITTED so an un-filled org secret
        # is a clean "not configured" rather than embedding an empty <password/> that Maven
        # would send as an empty-string credential.
        {
          echo '<?xml version="1.0" encoding="UTF-8"?>'
          echo '<settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"'
          echo '          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"'
          echo '          xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0'
          echo '                              https://maven.apache.org/xsd/settings-1.0.0.xsd">'
          echo '  <servers>'
          # GitHub Packages (always present)
          echo '    <server>'
          echo '      <id>github</id>'
          printf '      <username>%s</username>\n' "$MDF_GITHUB_USERNAME"
          printf '      <password>%s</password>\n' "$MDF_GITHUB_TOKEN"
          echo '    </server>'
          # MuleSoft EE (optional — only emit if BOTH username and password are set)
          if [[ -n "${MDF_EE_USERNAME:-}" && -n "${MDF_EE_PASSWORD:-}" ]]; then
            echo '    <server>'
            echo '      <id>mulesoft-ee-releases</id>'
            printf '      <username>%s</username>\n' "$MDF_EE_USERNAME"
            printf '      <password>%s</password>\n' "$MDF_EE_PASSWORD"
            echo '    </server>'
          fi
          # Anypoint Exchange v3 (optional — only emit if client_secret is set)
          if [[ -n "${MDF_EXCHANGE_SECRET:-}" ]]; then
            echo '    <server>'
            echo '      <id>anypoint-exchange-v3</id>'
            printf '      <username>%s</username>\n' "${MDF_EXCHANGE_ID:-~~~}"
            printf '      <password>%s</password>\n' "$MDF_EXCHANGE_SECRET"
            echo '    </server>'
          fi
          echo '  </servers>'
          echo '</settings>'
        } > "$file"

        mkdir -p "$RUNNER_TEMP/pw/.m2/repository"
        echo "MDF_SETTINGS_XML=$file" >> "$GITHUB_ENV"
        echo "Generated settings.xml at $file (inline, from org secrets)."
