# ============================================================
# mule-ci.yml — Caller workflow template for a MuleSoft app repo.
# Copy to .github/workflows/mule-ci.yml in the app repo and replace every __PLACEHOLDER__.
#
# Lifecycle (trunk-based):
#   1. feature/* branch   → workflow_dispatch → deploy to Design or Sandbox (manual, per BG)
#   2. PR to main         → validate (MUnit + quality gates, no deploy)
#   3. merge to main      → strip SNAPSHOT (ephemeral) → build → Production per BG (approval gated)
#                         → tag main at vX.Y.Z → GitHub Release
#
# Placeholders:
#   __ORG__              devops-foundry-2
#   __TEMPLATES_REF__    main (or a pinned tag of mule-cicd-workflows)
#   __DEPLOYMENT_TARGET__ ch2
#   __BUSINESS_GROUPS__  JSON array, primary BG first, e.g.
#                        '[{"key":"emea","prefix":"EMEA"},{"key":"amer","prefix":"AMER"}]'
#
# GitHub Environments required on the app repo (seeded at onboarding):
#   EMEA-Design, EMEA-Sandbox, EMEA-Production   (required reviewer on *-Production only)
#   AMER-Design, AMER-Sandbox, AMER-Production   (dual-region only)
#
# Config inherited from org level (visibility=all):
#   secrets  NONPROD_/PROD_CONNECTED_APP_ID|SECRET per BG (<BG>_<NONPROD|PROD>_CONNECTED_APP_*)
#            ANYPOINT_EXCHANGE_CLIENT_SECRET, *_SECURE_KEY (per tier)
#   vars     <BG>_ANYPOINT_BG_ID, <BG>_<TIER>_ENV_ID, <BG>_<TIER>_ENV_NAME, CLOUDHUB2_SPACE
# ============================================================
name: mule-ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy-tier:
        description: "Manual feature-branch deploy tier"
        required: true
        default: Design
        type: choice
        options:
          - Design
          - Sandbox
      bg-key:
        description: "Business group key (emea or amer)"
        required: true
        default: emea
      bg-prefix:
        description: "BG variable prefix (EMEA or AMER)"
        required: true
        default: EMEA

permissions:
  contents: write
  packages: write

jobs:
  # ── PR validation — MUnit + quality gates, no deploy ────────────────────────
  pre-checks:
    name: PR Validation
    if: github.event_name == 'pull_request'
    uses: __ORG__/mule-cicd-workflows/.github/workflows/validate.yml@__TEMPLATES_REF__
    with:
      run-owasp: false
      run-static-analysis: false
      templates-ref: __TEMPLATES_REF__
    secrets: inherit

  # ── Feature-branch manual deploy — Design or Sandbox for the picked BG ──────
  feature-deploy:
    name: Feature Deploy (${{ github.event.inputs.deploy-tier }} / ${{ github.event.inputs.bg-key }})
    if: github.event_name == 'workflow_dispatch'
    uses: __ORG__/mule-cicd-workflows/.github/workflows/feature-deploy.yml@__TEMPLATES_REF__
    with:
      tier: ${{ github.event.inputs.deploy-tier }}
      bg-key: ${{ github.event.inputs.bg-key }}
      bg-prefix: ${{ github.event.inputs.bg-prefix }}
      deployment-target: __DEPLOYMENT_TARGET__
      templates-ref: __TEMPLATES_REF__
      env-settings-ref: main
    secrets: inherit

  # ── Main merge — strip SNAPSHOT → Production (gated per BG) → tag + release ──
  main-release:
    name: Main → Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: __ORG__/mule-cicd-workflows/.github/workflows/main-release.yml@__TEMPLATES_REF__
    with:
      deployment-target: __DEPLOYMENT_TARGET__
      multi-bg-mode: sequential
      business-groups: '__BUSINESS_GROUPS__'
      templates-ref: __TEMPLATES_REF__
      env-settings-ref: main
    secrets: inherit
